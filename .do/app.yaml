# ABOUTME: DigitalOcean App Platform spec for catilda-prod (korotysh account).
# ABOUTME: Landing at / , cabinet SPA at /cabinet , Django API at /api on catilda.com.
name: catilda-prod
region: sfo
alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
domains:
- domain: catilda.com
  type: PRIMARY
- domain: www.catilda.com
  type: ALIAS
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: api
      preserve_path_prefix: true
    match:
      path:
        prefix: /api
  - component:
      name: api
      preserve_path_prefix: true
    match:
      path:
        prefix: /ops
  - component:
      name: api
      preserve_path_prefix: true
    match:
      path:
        prefix: /admin
  - component:
      name: cabinet
    match:
      path:
        prefix: /cabinet
  - component:
      name: web
    match:
      path:
        prefix: /
databases:
- name: db
  engine: PG
  version: "18"
  production: true
  cluster_name: db-postgresql-sfo3-34813
  db_name: catilda
  db_user: catilda
services:
- name: api
  environment_slug: python
  github:
    repo: yevhenkorotysh/de-backend
    branch: main
    deploy_on_push: true
  source_dir: /
  http_port: 8080
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-0.5gb
  health_check:
    http_path: /api/health/
    initial_delay_seconds: 10
    period_seconds: 10
    timeout_seconds: 5
    success_threshold: 1
    failure_threshold: 3
  run_command: python manage.py migrate --noinput && gunicorn --bind 0.0.0.0:8080 --workers 2 config.wsgi:application
  envs:
  - key: DJANGO_SETTINGS_MODULE
    scope: RUN_TIME
    value: config.settings.production
  - key: DJANGO_SECRET_KEY
    scope: RUN_TIME
    type: SECRET
    value: REPLACE_AT_CREATE
  - key: DJANGO_DEBUG
    scope: RUN_TIME
    value: "false"
  - key: DJANGO_ALLOWED_HOSTS
    scope: RUN_TIME
    value: "*"
  - key: CORS_ALLOWED_ORIGINS
    scope: RUN_TIME
    value: https://catilda.com,https://www.catilda.com
  - key: CSRF_TRUSTED_ORIGINS
    scope: RUN_TIME
    value: https://catilda.com,https://www.catilda.com
  - key: POSTGRES_DB
    scope: RUN_TIME
    value: ${db.DATABASE}
  - key: POSTGRES_USER
    scope: RUN_TIME
    value: ${db.USERNAME}
  - key: POSTGRES_PASSWORD
    scope: RUN_TIME
    type: SECRET
    value: ${db.PASSWORD}
  - key: POSTGRES_HOST
    scope: RUN_TIME
    value: ${db.HOSTNAME}
  - key: POSTGRES_PORT
    scope: RUN_TIME
    value: ${db.PORT}
  - key: POSTGRES_SSLMODE
    scope: RUN_TIME
    value: require
  - key: DISABLE_COLLECTSTATIC
    scope: BUILD_TIME
    value: "1"
  - key: CELERY_TASK_ALWAYS_EAGER
    scope: RUN_TIME
    value: "true"
  - key: DO_CLIENT
    scope: RUN_TIME
    value: fake
  - key: CHAT_DELIVERY
    scope: RUN_TIME
    value: echo
  - key: EMAIL_BACKEND
    scope: RUN_TIME
    value: django.core.mail.backends.console.EmailBackend
  - key: SMS_BACKEND
    scope: RUN_TIME
    value: console
static_sites:
- name: web
  environment_slug: html
  github:
    repo: yevhenkorotysh/catilda-landing
    branch: main
    deploy_on_push: true
  source_dir: /
  index_document: index.html
- name: cabinet
  environment_slug: node-js
  github:
    repo: yevhenkorotysh/de-frontend
    branch: main
    deploy_on_push: true
  source_dir: /
  build_command: npm ci && npm run build
  output_dir: dist
  index_document: index.html
  catchall_document: index.html
  envs:
  - key: VITE_BASE
    scope: BUILD_TIME
    value: /cabinet/
  - key: VITE_API_BASE_URL
    scope: BUILD_TIME
    value: ""
