<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Catilda — a quiet beacon for builders in the dark." />
  <title>Catilda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>

  <div class="noise" aria-hidden="true"></div>

  <header class="top">
    <a class="mark" href="/" aria-label="Catilda home">
      <span class="mark-orb" aria-hidden="true"></span>
      Catilda
    </a>
  </header>

  <main class="stage">
    <div class="porthole" aria-hidden="true">
      <span class="ring ring-a"></span>
      <span class="ring ring-b"></span>
      <span class="ring ring-c"></span>
    </div>

    <p class="eyebrow">Out past the noise</p>
    <h1>Catilda</h1>
    <p class="lede">
      A quiet beacon for builders working in the dark.
      Hold course. Signal when ready.
    </p>
    <p class="status">Coming soon</p>
  </main>

  <footer class="foot">
    <span>&copy; <span id="year"></span> Catilda</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
